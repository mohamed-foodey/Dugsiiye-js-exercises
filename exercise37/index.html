<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Blog Post exercise</title>
</head>
<body>
    <h1>simple blog Post</h1>
    <div class="container">
    <div class="blog-post">
        <h2>create a new post</h2>
        <input type="text" id="post-title" placeholder="Title"><br>
        <input type="text" id="img-url" placeholder="image Url (optional)"><br>
        <textarea id="content" placeholder="Write your post here..."></textarea><br>
        
        <button type="submit" id="btn-posts">Add post</button>
    </div>
    </div>

    <div class="all-posts">
        <p>All Posts</p>
        
    </div>

    <div class="div-append">

        <p></p>
    </div> -->
    </div>

    <script src="app.js"></script>
</body>
</html>
